[project]
name = "pathfinders42-api"
version = "0.3.0"
description = "API de análogos terrestres de la Luna y Marte (NASA Space Apps Challenge 2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "httpx2>=2.16.0",
    "ruff>=0.17.5",
]
# Solo para entrenar M1 (python -m modelos.m1.entrenar); la API no los necesita
ml = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "lightgbm>=4.7.0",
    "shap>=0.51.0",
    "pillow>=13.0.0",
    "reverse_geocoder>=1.5.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
# pipeline/ es una copia de los notebooks y scripts de Colab: no pasa el lint del backend
extend-exclude = ["pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # las líneas largas las corta ruff format
